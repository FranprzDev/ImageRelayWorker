name: Release Windows artifacts
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'installer/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
permissions: { contents: write }
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Validate
        shell: bash
        run: |
          go fmt ./...; go vet ./...; go test ./...; go test -race ./...
      - name: Build worker
        shell: bash
        run: go build -trimpath -ldflags="-s -w" -o image-relay-worker-windows-amd64.exe ./cmd/worker
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Install WiX UI extension
        shell: pwsh
        run: wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build MSI
        shell: pwsh
        run: |
          $msi = if ($env:GITHUB_REF_TYPE -eq 'tag') { "ImageRelayWorker-$env:GITHUB_REF_NAME.msi" } else { "ImageRelayWorker-pr.msi" }
          "MSI_NAME=$msi" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          wix build installer/ImageRelayWorker.wxs -d WorkerExe=image-relay-worker-windows-amd64.exe -d ConfigureScript=installer/configure.ps1 -o $msi -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext
      - name: Validate MSI install and uninstall
        shell: pwsh
        run: |
          $msi = $env:MSI_NAME
          $log = Join-Path $env:RUNNER_TEMP "image-relay-worker-msi.log"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log; throw "MSI install failed: $($p.ExitCode)" }
          $svc = Get-Service ImageRelayWorker -ErrorAction Stop
          if ($svc.Status -notin @('Stopped','Running')) { throw "Service was not registered correctly" }
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI uninstall failed: $($p.ExitCode)" }
          if (Get-Service ImageRelayWorker -ErrorAction SilentlyContinue) { throw "Service remained after uninstall" }

      - name: Checksums
        shell: pwsh
        run: |
          (Get-FileHash $env:MSI_NAME -Algorithm SHA256).Hash.ToLower() + "  $env:MSI_NAME" | Set-Content "$env:MSI_NAME.sha256"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: gh release create "${GITHUB_REF_NAME}" "$MSI_NAME" "$MSI_NAME.sha256" --title "ImageRelayWorker ${GITHUB_REF_NAME}" --generate-notes
