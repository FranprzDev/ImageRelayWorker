name: Release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate
        run: |
          go fmt ./...
          go vet ./...
          go test ./...
          go test -race ./...

      - name: Build Windows x64 executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w" -o image-relay-worker-windows-amd64.exe ./cmd/worker

      - name: Create checksum
        run: sha256sum image-relay-worker-windows-amd64.exe > image-relay-worker-windows-amd64.exe.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            image-relay-worker-windows-amd64.exe \
            image-relay-worker-windows-amd64.exe.sha256 \
            --title "ImageRelayWorker ${GITHUB_REF_NAME}" \
            --generate-notes
